services:
  ringremote:
    image: ghcr.io/yanorei32/ring-remote:latest@sha256:9726865d96f9eed290f5aaabf7cdd81e0d5fbea6febf39b3937f36a3448d17f3
    hostname: ringremote
    container_name: ringremote${VARIANT:-}__ringremote
    restart: unless-stopped

    environment:
      LISTEN: 0.0.0.0:3000
      TARGET: ${TARGET}

    command: /usr/bin/ring-remote

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2@sha256:55c7e3e8d89d5e8d20b75a82f3602cbf98e06db406e73e282073cfdc5a9a3af6
    hostname: cloudflared
    container_name: ringremote${VARIANT:-}__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      default:

networks:
  default:
    name: ringremote${VARIANT:-}__default
